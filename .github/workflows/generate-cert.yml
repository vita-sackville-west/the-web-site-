name: Generate Certificate Request

on:
  workflow_dispatch:

jobs:
  generate-csr:
    runs-on: macos-latest
    steps:
      - name: Generate CSR
        run: |
          openssl genrsa -out distribution.key 2048
          openssl req -new -key distribution.key -out distribution.csr \
            -subj "/CN=Alida Allen-Dahl/O=The WebSite/C=GB"
          echo "=== CSR CONTENT (copy everything below) ==="
          cat distribution.csr
          echo "=== PRIVATE KEY (save this securely) ==="
          cat distribution.key