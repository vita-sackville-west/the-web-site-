<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join the Waitlist — TheWeb</title>
<meta name="description" content="Not in London yet, or don't have a referral code? Join the waitlist for TheWeb.">
<meta property="og:title" content="Join the waitlist for TheWeb">
<meta property="og:description" content="We'll email you the moment TheWeb is available to you.">
<meta property="og:image" content="https://thelesbianwebsite.com/app-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thelesbianwebsite.com/waitlist">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://thelesbianwebsite.com/app-icon.png">
<link rel="icon" href="app-icon.png">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--pink:#FF2D78;--hot:#FF6EB4;--cyan:#00E5FF;--dark:#1A0A2E;--panel:#150826;--white:#FFF5FA;--lime:#39FF14;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--dark);color:var(--white);font-family:'Space Mono',monospace;font-size:14px;line-height:1.7;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,45,120,0.03) 3px,rgba(255,45,120,0.03) 4px);pointer-events:none;z-index:0;}
  .wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:56px 20px 60px;text-align:center;}

  .icon{width:72px;height:72px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:2px solid var(--pink);border-radius:18px;box-shadow:0 0 24px rgba(255,45,120,0.35);}
  .icon img{display:block;border-radius:14px;}

  h1{font-family:'VT323',monospace;font-size:34px;letter-spacing:1px;line-height:1.15;
    color:var(--white);text-shadow:0 0 14px rgba(255,110,180,0.5);margin-bottom:10px;}
  .sub{color:rgba(255,245,250,0.6);font-size:13.5px;letter-spacing:0.5px;margin-bottom:34px;padding:0 8px;}

  .card{background:var(--panel);border:1px solid rgba(0,229,255,0.25);border-radius:10px;padding:26px 22px;text-align:left;}
  .field-label{font-family:'VT323',monospace;font-size:15px;letter-spacing:3px;color:rgba(0,229,255,0.6);margin-bottom:8px;}
  .email-input{width:100%;background:rgba(255,245,250,0.05);border:2px solid rgba(255,245,250,0.15);
    color:var(--white);font-family:'Space Mono',monospace;font-size:14px;padding:12px 14px;outline:none;margin-bottom:14px;border-radius:6px;}
  .email-input:focus{border-color:var(--cyan);}
  .email-input::placeholder{color:rgba(255,245,250,0.25);}

  .btn{display:block;width:100%;text-align:center;font-family:'VT323',monospace;font-size:20px;letter-spacing:1px;
    padding:14px;border-radius:8px;cursor:pointer;border:none;background:var(--pink);color:var(--dark);
    box-shadow:0 0 20px rgba(255,45,120,0.4);}
  .btn:disabled{opacity:0.5;cursor:default;}

  .msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px;}
  .msg.ok{color:var(--lime);}
  .msg.err{color:#FF6E6E;}

  .success{display:none;text-align:center;}
  .success.show{display:block;}
  .success .big{font-size:44px;margin-bottom:10px;}

  footer{margin-top:40px;text-align:center;}
  footer a{color:var(--cyan);font-family:'VT323',monospace;font-size:15px;letter-spacing:1px;text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">

  <div class="icon"><img src="app-icon.png" alt="TheWeb" width="68" height="68"></div>

  <h1>Join the waitlist</h1>
  <div class="sub">Not in London yet, or don't have a referral code? Leave your email and we'll let you know the moment TheWeb is available to you.</div>

  <div class="card" id="form-card">
    <div class="field-label">EMAIL</div>
    <input class="email-input" id="wl-email" type="email" placeholder="your@email.com" autocomplete="email">
    <button class="btn" id="wl-submit">JOIN WAITLIST</button>
    <div class="msg" id="wl-msg"></div>
  </div>

  <div class="card success" id="success-card">
    <div style="text-align:center;">
      <div class="big">✓</div>
      <div style="font-family:'VT323',monospace;font-size:22px;color:var(--lime);letter-spacing:1px;margin-bottom:8px;">YOU'RE ON THE LIST</div>
      <div style="color:rgba(255,245,250,0.6);font-size:13px;">We'll email you — no spam, just one message when it's your turn.</div>
    </div>
  </div>

  <footer><a href="https://thelesbianwebsite.com/support">Learn more →</a></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient('https://qfdldsdeillxsmhlgmhh.supabase.co', 'sb_publishable_PbiY5usvJ8WRpE67gwMYxQ_A32Hux8Y');

const emailInput = document.getElementById('wl-email');
const submitBtn = document.getElementById('wl-submit');
const msgEl = document.getElementById('wl-msg');

function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

submitBtn.addEventListener('click', async () => {
  const email = emailInput.value.trim();
  msgEl.textContent = '';
  msgEl.className = 'msg';
  if(!isValidEmail(email)){
    msgEl.textContent = 'Enter a valid email address.';
    msgEl.className = 'msg err';
    return;
  }
  submitBtn.disabled = true;
  submitBtn.textContent = 'JOINING...';
  const { error } = await sb.from('waitlist').insert({ email });
  submitBtn.disabled = false;
  submitBtn.textContent = 'JOIN WAITLIST';
  if(error){
    if(error.code === '23505'){
      msgEl.textContent = "You're already on the list!";
      msgEl.className = 'msg ok';
    } else {
      msgEl.textContent = 'Something went wrong — try again in a moment.';
      msgEl.className = 'msg err';
    }
    return;
  }
  document.getElementById('form-card').style.display = 'none';
  document.getElementById('success-card').classList.add('show');
});

emailInput.addEventListener('keydown', e => { if(e.key === 'Enter') submitBtn.click(); });
</script>
</body>
</html>
